name: Security Scans

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-scans-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            **/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install audit tools and frontend dependencies
        run: |
          pip install pip-audit==2.10.1
          npm ci --prefix frontend
      - name: Audit Python requirements
        continue-on-error: true
        run: |
          mkdir -p scan-results/pip
          status=0
          while IFS= read -r requirements; do
            output=$(echo "$requirements" | tr '/.' '--')
            pip-audit --requirement "$requirements" --format json --output "scan-results/pip/${output}.json" || status=1
          done < <(find . -name 'requirements*.txt' -not -path './.venv/*' -not -path './frontend/node_modules/*' | sort)
          exit "$status"
      - name: Audit frontend dependencies
        continue-on-error: true
        run: npm audit --prefix frontend --json > scan-results/npm-audit.json
      - name: Summarize dependency findings
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import json
          from pathlib import Path

          counts = {level: 0 for level in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN")}
          for path in glob.glob("scan-results/pip/*.json"):
              try:
                  payload = json.loads(Path(path).read_text())
              except (OSError, json.JSONDecodeError):
                  continue
              counts["UNKNOWN"] += sum(len(row.get("vulns", [])) for row in payload.get("dependencies", []))

          npm_counts = {level: 0 for level in counts}
          path = Path("scan-results/npm-audit.json")
          if path.exists():
              try:
                  vulnerabilities = json.loads(path.read_text()).get("metadata", {}).get("vulnerabilities", {})
                  npm_counts.update({
                      "CRITICAL": int(vulnerabilities.get("critical", 0)),
                      "HIGH": int(vulnerabilities.get("high", 0)),
                      "MEDIUM": int(vulnerabilities.get("moderate", 0)),
                      "LOW": int(vulnerabilities.get("low", 0)),
                      "UNKNOWN": int(vulnerabilities.get("info", 0)),
                  })
              except (ValueError, json.JSONDecodeError):
                  pass

          summary = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as output:
              output.write("### Dependency vulnerability counts\n\n")
              output.write("| Scanner | Critical | High | Medium | Low | Unknown |\n|---|---:|---:|---:|---:|---:|\n")
              output.write("| pip-audit | {CRITICAL} | {HIGH} | {MEDIUM} | {LOW} | {UNKNOWN} |\n".format(**counts))
              output.write("| npm audit | {CRITICAL} | {HIGH} | {MEDIUM} | {LOW} | {UNKNOWN} |\n".format(**npm_counts))
          print("pip-audit", counts)
          print("npm-audit", npm_counts)
          PY
      - name: Upload dependency scan details
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dependency-scan-results-${{ github.run_id }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 14

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.68.2
          cache: true
      - name: Create disposable build configuration
        run: python3 scripts/setup_local.py
      - name: Build application images
        run: docker compose build
      - name: Scan repository filesystem
        continue-on-error: true
        run: |
          mkdir -p scan-results/trivy
          trivy filesystem --scanners vuln,misconfig,secret --format json --output scan-results/trivy/filesystem.json --exit-code 1 .
      - name: Scan stack container images
        continue-on-error: true
        run: |
          status=0
          while IFS= read -r image; do
            output=$(echo "$image" | tr '/:@' '---')
            trivy image --format json --output "scan-results/trivy/image-${output}.json" --exit-code 1 "$image" || status=1
          done < <(docker compose config --images | sort -u)
          exit "$status"
      - name: Summarize Trivy findings
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          def findings(pattern):
              counts = {level: 0 for level in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN")}
              for path in glob.glob(pattern):
                  try:
                      payload = json.loads(Path(path).read_text())
                  except (OSError, json.JSONDecodeError):
                      continue
                  for result in payload.get("Results") or []:
                      for key in ("Vulnerabilities", "Misconfigurations", "Secrets"):
                          for finding in result.get(key) or []:
                              severity = str(finding.get("Severity") or "UNKNOWN").upper()
                              counts[severity if severity in counts else "UNKNOWN"] += 1
              return counts

          filesystem = findings("scan-results/trivy/filesystem.json")
          images = findings("scan-results/trivy/image-*.json")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("### Trivy finding counts\n\n")
              output.write("| Target | Critical | High | Medium | Low | Unknown |\n|---|---:|---:|---:|---:|---:|\n")
              output.write("| Filesystem | {CRITICAL} | {HIGH} | {MEDIUM} | {LOW} | {UNKNOWN} |\n".format(**filesystem))
              output.write("| Container images | {CRITICAL} | {HIGH} | {MEDIUM} | {LOW} | {UNKNOWN} |\n".format(**images))
          print("trivy-filesystem", filesystem)
          print("trivy-images", images)
          PY
      - name: Upload Trivy scan details
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-scan-results-${{ github.run_id }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 14
