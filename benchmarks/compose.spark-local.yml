services:
  spark-streaming:
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --jars
      - /opt/spark/jars/org.apache.spark_spark-sql-kafka-0-10_2.12-3.5.3.jar,/opt/spark/jars/org.apache.spark_spark-token-provider-kafka-0-10_2.12-3.5.3.jar,/opt/spark/jars/org.apache.kafka_kafka-clients-3.4.1.jar,/opt/spark/jars/org.apache.commons_commons-pool2-2.11.1.jar
      - app/main.py
